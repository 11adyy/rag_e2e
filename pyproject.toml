[project]
name = "pythonproject"
version = "0.1.0"
description = "Agentic RAG Project"
readme = "README.md"
authors = [
    { name = "11adyy", email = "contact@11adyy.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.26.0",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-docling>=2.0.0",
    "langchain-experimental>=0.4.2",
    "langchain-fireworks>=1.5.2",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.10.15",
    "networkx>=3.6.1",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "llm: tests that call real LLM APIs (require OPENAI_API_KEY)",
    "live: tests that require a running server at LIVE_SERVER_URL",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
